<!-- WBS-SEARCH-WIDGET v2 · 站内搜索（exam-paper-solutions 技能统一注入；删掉这行标记会导致重复注入） -->
<style>
.wbs-search{
  position:fixed; top:12px; right:16px; z-index:9998;
  display:flex; align-items:center; gap:6px;
  padding:6px 9px; border:1px solid var(--line,#d8d8d8); border-radius:6px;
  background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.10);
  font-family:"Songti SC","STSong","Noto Serif CJK SC",serif; font-size:13px; line-height:1.4;
  opacity:.42; transition:opacity .18s ease;
}
.wbs-search:hover, .wbs-search:focus-within{ opacity:1; }
.wbs-search .wbs-lb{
  color:var(--accent,#8b1f1f); font-weight:700; font-size:12px;
  letter-spacing:1px; padding:0 2px; border-right:1px solid var(--line,#d8d8d8); margin-right:2px;
}
.wbs-search input{
  border:0; outline:0; background:transparent; width:178px;
  font-family:inherit; font-size:13px; color:#1a1a1a;
}
.wbs-search input::placeholder{ color:#aaa; }
.wbs-search input::-webkit-search-cancel-button{ display:none; }
.wbs-search .wbs-cnt{ color:#999; font-size:11.5px; min-width:46px; text-align:right; white-space:nowrap; }
.wbs-search button{
  border:1px solid var(--line,#d8d8d8); background:#fafaf8; color:#666;
  border-radius:4px; cursor:pointer; font-size:12px; line-height:1;
  padding:3px 6px; font-family:inherit;
}
.wbs-search button:hover{ background:var(--accent2,#f6efef); color:var(--accent,#8b1f1f); border-color:#e2c9c9; }
mark.wbs-hit{ background:#ffe28a; color:inherit; border-radius:2px; padding:0 1px; }
mark.wbs-hit.wbs-cur{ background:#ff9b3d; color:#1a1a1a; box-shadow:0 0 0 2px rgba(255,155,61,.45); }
.wbs-jump{ animation:wbsFlash 1.4s ease-out; }
@keyframes wbsFlash{
  0%{ background:#ffe9a8; box-shadow:0 0 0 3px #ffe9a8; }
  100%{ background:transparent; box-shadow:none; }
}
@media (max-width:760px){ .wbs-search input{ width:118px; } .wbs-search .wbs-cnt{ min-width:38px; } }
@media print{
  .wbs-search{ display:none !important; }
  mark.wbs-hit{ background:transparent !important; color:inherit !important; box-shadow:none !important; }
  .wbs-jump{ animation:none !important; }
}
</style>
<div class="wbs-search" role="search" aria-label="站内搜索">
  <span class="wbs-lb">查</span>
  <input id="wbsInput" type="search" autocomplete="off" spellcheck="false"
         placeholder="题号（如 6、18(2)）或关键词…" title="回车下一处，Shift+回车上一处，Esc 清空">
  <span class="wbs-cnt" id="wbsCnt"></span>
  <button type="button" id="wbsPrev" title="上一处（Shift+Enter）">↑</button>
  <button type="button" id="wbsNext" title="下一处（Enter）">↓</button>
  <button type="button" id="wbsClear" title="清空（Esc）">×</button>
</div>
<script>
(function(){
"use strict";
if(window.__wbsSearchReady){ return; }
window.__wbsSearchReady = true;

var input = document.getElementById('wbsInput');
var cnt   = document.getElementById('wbsCnt');
if(!input || !cnt){ return; }

var hits = [], cur = -1, timer = null;

function clearMarks(){
  var ms = document.querySelectorAll('mark.wbs-hit');
  for(var i = 0; i < ms.length; i++){
    var m = ms[i], p = m.parentNode;
    p.replaceChild(document.createTextNode(m.textContent), m);
    if(p.normalize){ p.normalize(); }
  }
  hits = []; cur = -1;
}

function collect(){
  var out = [];
  var w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
  var n;
  while((n = w.nextNode())){
    var v = n.nodeValue;
    if(!v || !v.replace(/\s/g, '')){ continue; }
    var p = n.parentNode, tag = p.nodeName;
    if(tag === 'SCRIPT' || tag === 'STYLE' || tag === 'MARK' || tag === 'TEXTAREA'){ continue; }
    if(p.closest && p.closest('.wbs-search')){ continue; }
    out.push(n);
  }
  return out;
}

function markAll(q){
  clearMarks();
  var ql = q.toLowerCase();
  var nodes = collect();
  for(var i = 0; i < nodes.length; i++){
    var node = nodes[i], txt = node.nodeValue, low = txt.toLowerCase();
    var idx = low.indexOf(ql);
    if(idx < 0){ continue; }
    var frag = document.createDocumentFragment(), pos = 0;
    while(idx >= 0){
      if(idx > pos){ frag.appendChild(document.createTextNode(txt.slice(pos, idx))); }
      var mk = document.createElement('mark');
      mk.className = 'wbs-hit';
      mk.textContent = txt.slice(idx, idx + q.length);
      frag.appendChild(mk);
      hits.push(mk);
      pos = idx + q.length;
      idx = low.indexOf(ql, pos);
    }
    if(pos < txt.length){ frag.appendChild(document.createTextNode(txt.slice(pos))); }
    node.parentNode.replaceChild(frag, node);
  }
}

function show(){
  cnt.textContent = hits.length ? ((cur + 1) + '/' + hits.length) : '';
}

function goto(i){
  if(!hits.length){
    cnt.textContent = '无匹配';
    return;
  }
  if(i < 0){ i = hits.length - 1; }
  if(i >= hits.length){ i = 0; }
  if(cur >= 0 && hits[cur]){ hits[cur].className = 'wbs-hit'; }
  cur = i;
  hits[cur].className = 'wbs-hit wbs-cur';
  hits[cur].scrollIntoView({ block: 'center' });
  show();
}

var QRE = /^\s*第?\s*([0-9]+(?:\.[0-9]+)?)\s*(?:[（(]\s*([0-9]+)\s*[）)])?\s*题?\s*$/;

function findByQ(num){
  var els = Array.prototype.slice.call(
    document.querySelectorAll('.q,.kp-item,.kp-no,h2,h3'));
  var esc = num.replace(/\./g, '\\.');
  var reA = new RegExp('^第\\s*' + esc + '\\s*题');
  var reB = new RegExp('(^|[^0-9.])' + esc + '\\s*[.、．题（(]');
  var reC = new RegExp('^' + esc + '(?![0-9.])');
  var dotted = num.indexOf('.') >= 0;
  for(var i = 0; i < els.length; i++){
    var t = (els[i].textContent || '').replace(/\s+/g, ' ').trim().slice(0, 80);
    if(!t){ continue; }
    if(reA.test(t) || reB.test(t)){ return els[i]; }
    if(dotted && reC.test(t)){ return els[i]; }
  }
  return null;
}

function jumpTo(el){
  el.classList.remove('wbs-jump');
  void el.offsetWidth;
  el.classList.add('wbs-jump');
  el.scrollIntoView({ block: 'center' });
}

function doSearch(){
  var raw = input.value.trim();
  if(!raw){ clearMarks(); cnt.textContent = ''; return; }

  var m = raw.match(QRE);
  if(m && raw.length <= 10){
    var el = findByQ(m[1]);
    if(el){ clearMarks(); cnt.textContent = '第' + m[1] + '题'; jumpTo(el); return; }
  }
  markAll(raw);
  if(hits.length){ goto(0); } else { cnt.textContent = '无匹配'; }
}

input.addEventListener('input', function(){
  clearTimeout(timer);
  timer = setTimeout(doSearch, 160);
});

input.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){
    e.preventDefault();
    if(!hits.length){ doSearch(); }
    else if(e.shiftKey){ goto(cur - 1); }
    else { goto(cur + 1); }
  }else if(e.key === 'Escape'){
    input.value = '';
    clearMarks();
    cnt.textContent = '';
    input.blur();
  }
});

document.getElementById('wbsNext').addEventListener('click', function(){
  if(hits.length){ goto(cur + 1); } else { doSearch(); }
});
document.getElementById('wbsPrev').addEventListener('click', function(){
  if(hits.length){ goto(cur - 1); }
});
document.getElementById('wbsClear').addEventListener('click', function(){
  input.value = '';
  clearMarks();
  cnt.textContent = '';
  input.focus();
});

document.addEventListener('keydown', function(e){
  var ae = document.activeElement;
  if(e.key === '/' && ae !== input && !/^(INPUT|TEXTAREA)$/.test(ae && ae.nodeName)){
    e.preventDefault();
    input.focus();
    input.select();
  }
});
})();
</script>
<!-- /WBS-SEARCH-WIDGET -->
